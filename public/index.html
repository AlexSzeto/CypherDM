<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CypherDM</title>

    <!-- Default to the dark theme on first visit (theme.mjs honours this cookie) -->
    <script>
      if (!/(^|;\s*)theme=/.test(document.cookie)) {
        document.cookie = 'theme=dark; path=/; max-age=31536000'
      }
    </script>

    <!-- Local Fonts -->
    <link rel="stylesheet" href="/css/fonts.css" />

    <!-- Local Imports -->
    <script type="importmap">
      {
        "imports": {
          "preact": "/lib/preact/preact.js",
          "preact/hooks": "/lib/preact/hooks.js",
          "preact/compat": "/lib/preact/compat.js",
          "@preact/signals": "/lib/preact/signals.js",
          "htm/preact": "/lib/htm/preact.js",
          "goober": "/lib/goober/goober.js",
          "goober/prefixer": "/lib/goober/prefixer.js"
        }
      }
    </script>

    <!-- Local Scripts -->
    <script src="/lib/boxicons/boxicons.js"></script>
  </head>
  <body>
    <!-- Root App Container -->
    <div id="app"></div>

    <!-- Main Entry Point -->
    <script type="module" src="/js/app.mjs"></script>
  </body>
</html>
